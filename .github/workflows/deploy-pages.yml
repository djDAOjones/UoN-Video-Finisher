# Deploys the UoN Video Tools preview to GitHub Pages: one site, each tool
# in its own folder beside the others, the placeholder staff lobby at the top
# (VH-226, D14). A service worker controls its own folder and everything below
# it, so no tool's folder sits inside another's and the lobby registers none.
#
# The maintainer accepted a public site on 2026-08-25 for piloting — it is
# unadvertised, and the intended home is an internal server once this is ready
# to show. So `main` deploys automatically, with manual dispatch kept for
# re-running without a commit.
#
# The app processes video entirely on the viewer's device, so deploying it
# exposes no media. What deploying DOES expose is the branding assets and the
# tool itself.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top, and the deploy credentials granted only to the
# job that deploys (VH-65). `build` runs `npm ci` and then the whole test
# suite, which is a lot of third-party code to hand a token that can publish to
# the University's pilot site. It needs to read the repository and nothing
# more.
permissions:
  contents: read

# Never publish two builds at once; let a queued run supersede a waiting one,
# but do not cancel one that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to commit SHAs, not to `v4`. A major-version tag is
# mutable: whoever controls it can move it to any commit, and that commit runs
# with this workflow's permissions on every push to `main` — which is this
# project's act of publishing. The version each SHA resolves to is named beside
# it, and the update route is to re-resolve the tag deliberately
# (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`) rather than to let it
# drift. Last re-resolved 2026-10-01, onto releases that run on Node 24: the
# Node 20 ones were being forced onto it by the runner, with a deprecation
# warning on every deploy.
jobs:
  build:
    # Pinned, not ubuntu-latest (UVT-8): the one playwright-core, 1.56.1 (Set
    # 1, exact), installs its Chromium headless shell on Ubuntu up to 24.04 and
    # refuses ubuntu-latest's 26.04 (run 46014634677). A newer runner comes with
    # a Playwright that supports it, by decision.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The newest commit and its parent, so the commit-ID check can see
          # what the newest commit changed (UVT-1).
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # One install, at the root; each tool finds it by walking up. No
      # dependency's install script runs (UVT-7): package.json denies each in
      # allowScripts, and --ignore-scripts holds whatever npm the runner has,
      # so Carbon's and IBM Plex's telemetry postinstalls, which collect only
      # on CI, never run here.
      - run: npm ci --ignore-scripts

      # Playwright's Chromium headless shell for the root's accessibility gate
      # (UVT-8), at the revision the one playwright-core names (Set 1, exact),
      # installed into an explicit browser cache outside the checkout, and that
      # path set for every later step: the pack's runner reads
      # PLAYWRIGHT_BROWSERS_PATH, else macOS's cache, and never downloads.
      - name: Install Playwright's Chromium headless shell
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" npm exec --no -- playwright install --with-deps --only-shell chromium

      # CI runs every command of the root gate (UVT-8), checked first and on
      # its own, so a gate step below removed, made conditional or allowed to
      # fail stops the run here, before any gate or build.
      - name: Check CI runs every command of the gate
        run: node --test scripts/deploy-workflow.test.mjs

      # The full gate, not just a build: every tool's, each from its own
      # folder, which is what `npm run check` at the root runs. A deploy is the
      # one place where shipping a broken bundle is expensive to undo, and one
      # tool's red gate holds back every tool's preview, as intended.
      - run: npm run check
        working-directory: finisher
        env:
          BASE_PATH: /${{ github.event.repository.name }}/finisher/

      - run: npm run check
        working-directory: name-graphics
        env:
          BASE_PATH: /${{ github.event.repository.name }}/name-graphics/

      # The parent's own checks: the commit-ID check (in this shallow
      # checkout, the newest commit only), the root's lint, types and tests,
      # the lobby's accessibility gate on a fresh build served at the Pages
      # base path (UVT-8), and the parent ledger's checker (UVT-1).
      - run: npm run check:root
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # The gate writes nothing in the checkout (UVT-8): no dist/, and no
      # tracked or untracked file changed, before the builds below make theirs.
      # One test a line: bash -e stops on a failed command, but not on one
      # before && in a list.
      - name: Check the gate left the checkout as it found it
        run: |
          test ! -e finisher/dist
          test ! -e name-graphics/dist
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

      # Each tool built for its own folder. The base is derived from the
      # repo name so a fork or a rename does not silently produce a site whose
      # asset URLs all 404.
      - name: Build the Finisher into finisher/
        run: npm run build
        working-directory: finisher
        env:
          BASE_PATH: /${{ github.event.repository.name }}/finisher/

      - name: Build Video Name Graphics into name-graphics/
        run: npm run build
        working-directory: name-graphics
        env:
          BASE_PATH: /${{ github.event.repository.name }}/name-graphics/

      # The lobby's page is rendered from lobby/Lobby.tsx here, at build
      # time, as a static page with no script (UVT-8).
      - name: Gather the site
        run: |
          mkdir _site
          node scripts/build-lobby.mjs _site
          cp -R finisher/dist _site/finisher
          cp -R name-graphics/dist _site/name-graphics
          # Each page the lobby links to is there, not a level too deep (UVT-8).
          test -s _site/finisher/index.html
          test -s _site/name-graphics/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Composite: runs actions/upload-artifact v7.0.0, pinned by SHA inside it.
      # From v4 it leaves dotfiles out of the artifact; the builds have none.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that needs these, and the only one that has them.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
